<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USB Viewer</title>
<style>
  :root {
    --bg: #000;
    --fg: #e8e8e8;
    --dim: #555;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
    overflow: hidden;
    cursor: none;
    user-select: none;
  }
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vmin;
  }
  svg {
    width: 12vmin;
    height: 12vmin;
    animation: breathe 4s ease-in-out infinite;
  }
  p {
    margin: 0;
    font-size: 2.2vmin;
    letter-spacing: 0.3em;
    color: var(--dim);
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="22" y="6" width="20" height="16" rx="2"/>
    <rect x="18" y="22" width="28" height="36" rx="4"/>
    <line x1="28" y1="12" x2="28" y2="16"/>
    <line x1="36" y1="12" x2="36" y2="16"/>
  </svg>
  <p>INSERT USB</p>
</main>
</body>
</html>
